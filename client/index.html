<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Gateway</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
    button { font-size: 1.1rem; padding: .6rem 1.4rem; cursor: pointer; }
    #status { margin: 1rem 0; font-weight: 600; }
    #log { font-family: ui-monospace, monospace; font-size: .85rem; color: #555; padding-left: 1.2rem; }
    .hint { color: #777; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Voice Gateway</h1>
  <p class="hint">Use headphones: the browser's echo cancellation helps, but the speaker can still leak into the mic and look like an interruption.</p>
  <button id="toggle">Start</button>
  <div id="status">idle</div>
  <ul id="log"></ul>
  <p class="hint"><a href="dashboard.html">Metrics dashboard</a></p>
  <script src="app.js"></script>
</body>
</html>
